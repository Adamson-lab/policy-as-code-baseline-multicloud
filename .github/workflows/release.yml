name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write   # keyless signing; no stored keys
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/verify_parity.py && cd .. && zip -r pac-bundle-${{ github.ref_name }}.zip "$(basename "$GITHUB_WORKSPACE")/policies" "$(basename "$GITHUB_WORKSPACE")/controls" "$(basename "$GITHUB_WORKSPACE")/docs/mapping-matrix.md"
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign-blob --yes ../pac-bundle-${{ github.ref_name }}.zip --output-signature ../bundle.sig
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ../pac-bundle-${{ github.ref_name }}.zip
            ../bundle.sig
