<text x="40" y="970" font-size="10.5" fill="#232F3E"><tspan font-weight="700">Note:</tspan> Rule of thumb: attach at the business-unit level, exempt at workload level, never at the root. Child policies can only tighten AWS SCPs, but Azure and GCP allow overrides.</text>
